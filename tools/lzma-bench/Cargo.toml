[package]
name = "lzma-bench"
description = "Decode-throughput harness for lzma-fast against the reference decoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lzma-fast = { workspace = true }
lzma-rust2 = "0.20.1"
# The C library this crate exists to replace, for the `--xz` lane only.
liblzma = { version = "0.4.8", features = ["parallel"] }
